<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Worker Dashboard - SkillSetu</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a
            class="navbar-brand"
            href="index.html">

            SkillSetu

        </a>

        <a
            href="index.html"
            class="btn btn-light">

            Home

        </a>

    </div>

</nav>



<!-- =========================
     DASHBOARD
========================= -->

<div class="container mt-5">


    <h1 class="text-center mb-4">

        👷 Worker Dashboard

    </h1>



    <!-- Worker Profile -->

    <div class="card shadow p-4 mb-4">

        <h2 id="workerName">

            Loading...

        </h2>

        <h5
            id="workerCategory"
            class="text-primary">

        </h5>


        <p>

            <strong>📍 Location:</strong>

            <span id="workerLocation">

            </span>

        </p>


        <p>

            <strong>📞 Contact:</strong>

            <span id="workerContact">

            </span>

        </p>


        <p>

            <strong>⭐ Rating:</strong>

            <span id="workerRating">

            </span>

        </p>

    </div>



    <!-- Statistics -->

    <div class="row mb-4">


        <div class="col-md-4 mb-3">

            <div class="card shadow text-center p-4">

                <h3 id="bookingCount">

                    0

                </h3>

                <p>

                    📅 Bookings

                </p>

            </div>

        </div>



        <div class="col-md-4 mb-3">

            <div class="card shadow text-center p-4">

                <h3 id="reviewCount">

                    0

                </h3>

                <p>

                    ⭐ Reviews

                </p>

            </div>

        </div>



        <div class="col-md-4 mb-3">

            <div class="card shadow text-center p-4">

                <h3 id="ratingBox">

                    0

                </h3>

                <p>

                    ⭐ Average Rating

                </p>

            </div>

        </div>

    </div>



    <!-- Bookings -->

    <div class="card shadow p-4 mb-4">

        <h2 class="mb-4">

            📅 Booking Requests

        </h2>


        <div id="bookingContainer">

            <p>

                Loading bookings...

            </p>

        </div>

    </div>



    <!-- Reviews -->

    <div class="card shadow p-4 mb-4">

        <h2 class="mb-4">

            ⭐ Customer Reviews

        </h2>


        <div id="reviewContainer">

            <p>

                Loading reviews...

            </p>

        </div>

    </div>



</div>



<!-- Axios -->

<script
    src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js">
</script>


<!-- Worker Dashboard JS -->

<script src="js/worker-dashboard.js"></script>


</body>

</html>
