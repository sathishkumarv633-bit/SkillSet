<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SkillSetU - Admin Login</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<!-- ==============================
     ADMIN LOGIN
================================ -->

<div class="container">

    <div class="row justify-content-center align-items-center"
         style="min-height: 100vh;">

        <div class="col-md-5">

            <div class="card shadow p-4">

                <div class="text-center mb-4">

                    <h1>
                        🔐 Admin Login
                    </h1>

                    <p class="text-muted">
                        SkillSetU Administration
                    </p>

                </div>


                <!-- LOGIN FORM -->

                <form id="adminLoginForm">

                    <!-- Username -->

                    <div class="mb-3">

                        <label class="form-label">
                            Username
                        </label>

                        <input
                            type="text"
                            id="adminUsername"
                            class="form-control"
                            placeholder="Enter admin username"
                            required>

                    </div>


                    <!-- Password -->

                    <div class="mb-3">

                        <label class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            id="adminPassword"
                            class="form-control"
                            placeholder="Enter admin password"
                            required>

                    </div>


                    <!-- Login -->

                    <button
                        type="submit"
                        class="btn btn-danger w-100">

                        🔐 Login

                    </button>

                </form>


                <!-- BACK HOME -->

                <div class="text-center mt-3">

                    <a
                        href="index.html"
                        class="btn btn-outline-primary">

                        🏠 Back to Home

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- ==============================
     ADMIN LOGIN JS
================================ -->

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js">
</script>

<script src="js/admin-login.js">
</script>

</body>

</html>
