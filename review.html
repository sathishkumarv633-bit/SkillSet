<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Write a Review - SkillSetu</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand" href="index.html">
            SkillSetu
        </a>

    </div>

</nav>


<!-- Review Section -->
<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow p-4">

                <h2 class="text-center mb-4">
                    ⭐ Write a Review
                </h2>


                <form id="reviewForm">

                    <!-- Customer Name -->

                    <label class="form-label">
                        Your Name
                    </label>

                    <input
                        type="text"
                        id="customerName"
                        class="form-control"
                        placeholder="Enter your name"
                        required>


                    <!-- Rating -->

                    <label class="form-label mt-3">
                        Rating
                    </label>

                    <select
                        id="rating"
                        class="form-select"
                        required>

                        <option value="">
                            Select Rating
                        </option>

                        <option value="5">
                            ⭐⭐⭐⭐⭐ 5
                        </option>

                        <option value="4">
                            ⭐⭐⭐⭐ 4
                        </option>

                        <option value="3">
                            ⭐⭐⭐ 3
                        </option>

                        <option value="2">
                            ⭐⭐ 2
                        </option>

                        <option value="1">
                            ⭐ 1
                        </option>

                    </select>


                    <!-- Review -->

                    <label class="form-label mt-3">
                        Your Review
                    </label>

                    <textarea
                        id="reviewText"
                        class="form-control"
                        rows="5"
                        placeholder="Write your experience..."
                        required></textarea>


                    <!-- Submit -->

                    <button
                        type="submit"
                        class="btn btn-success w-100 mt-4">

                        Submit Review

                    </button>

                </form>


                <a
                    href="index.html"
                    class="btn btn-secondary w-100 mt-2">

                    Back to Home

                </a>

            </div>

        </div>

    </div>

</div>


<!-- Axios -->

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>


<!-- Review JavaScript -->

<script src="js/review.js"></script>

</body>
</html>
